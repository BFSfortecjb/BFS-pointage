<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pointage BFS</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#080808" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div id="app"></div>

  <!-- Ordre impératif : config avant core avant app -->
  <script src="PT_debug.js"></script>
  <script src="PT_config.js"></script>
  <script src="PT_core.js"></script>
  <script src="PT_app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('PT_service-worker.js', { scope: './' })
          .catch((erreur) => console.warn('Service worker non enregistré :', erreur));
      });
    }
  </script>
</body>
</html>
